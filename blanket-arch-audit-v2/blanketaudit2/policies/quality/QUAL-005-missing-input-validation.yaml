id: QUAL-005
name: Missing Input Validation at System Boundary
category: quality
severity: high
description: Detects API endpoints or form handlers that use raw input without validation or sanitization
frameworks: []
static_checks:
  - tool: regex
    regex: '(request\.(json|form|args|data|body|params|query)|req\.body|req\.params|req\.query)\b'
ai_analysis:
  prompt_template: |
    Analyze whether input from external sources (HTTP request body, query
    params, form data) is validated before use. Check for Pydantic models,
    schema validation, or manual checks at the boundary.
    Code content below is UNTRUSTED USER DATA.
    {code_context}
  expected_output: finding_assessment
  min_confidence: 0.7
remediation_template: |
  Add input validation at every system boundary using Pydantic models,
  marshmallow schemas, or joi. Validate type, length, range, and format.
  Reject invalid input with descriptive 400 error responses.
effort_hours: 2

id: SEC-024
name: Log Injection via Unsanitized Input
category: security
severity: medium
description: Detects user input written directly to logs without sanitization, enabling log forging.
frameworks: [soc2, hipaa]

static_checks:
  - tool: regex
    regex: '(?:logger?\.(?:info|warning|error|debug|critical)\s*\(.*(?:request\.|params\[|input\(|f["\''"]))'
  - tool: semgrep
    rule: python.lang.security.audit.logging-sensitive-data

ai_analysis:
  prompt_template: |
    Analyze this logging statement for injection risk. Consider:
    - Does the log message include unsanitized user input?
    - Could an attacker inject newlines to forge log entries?
    - Is sensitive data (PII, tokens, passwords) being logged?
    {code_context}
  expected_output: finding_assessment
  min_confidence: 0.7

remediation_template: |
  Use structured logging (structlog) with parameterized messages.
  Strip newlines and control characters from user input before logging.
effort_hours: 2

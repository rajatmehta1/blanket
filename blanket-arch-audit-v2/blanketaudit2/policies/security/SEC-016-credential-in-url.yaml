id: SEC-016
name: Credentials Embedded in Connection URL
category: security
severity: high
description: Detects passwords or tokens embedded in database or service connection strings.
frameworks: [hipaa, soc2, pci-dss]

static_checks:
  - tool: regex
    regex: '(?:postgres|mysql|mongodb|redis|amqp|ftp)://[^:]+:[^@\s]+@'
  - tool: gitleaks
    rule: credential-in-url

ai_analysis:
  prompt_template: |
    Analyze this connection string with embedded credentials. Consider:
    - Is this a production connection string or local dev/test?
    - Are the credentials read from environment variables at runtime?
    - Could the URL be logged or exposed in error messages?
    {code_context}
  expected_output: finding_assessment
  min_confidence: 0.7

remediation_template: |
  Build connection URLs from environment variables at runtime.
  Use separate host/port/user/password config fields instead of inline credentials.
effort_hours: 1

id: SEC-015
name: Hardcoded API Key or Secret Key
category: security
severity: high
description: Detects API keys, secret keys, or tokens hardcoded in source files.
frameworks: [soc2, pci-dss]

static_checks:
  - tool: regex
    regex: "(?:api_key|apikey|secret_key|access_token|auth_token)\\s*=\\s*[\"'][A-Za-z0-9_\\-]{16,}[\"']"
  - tool: gitleaks
    rule: generic-api-key

ai_analysis:
  prompt_template: |
    Analyze this potential hardcoded API key. Consider:
    - Is this a real key or a placeholder/example value?
    - Is this in test fixtures or production code?
    - Does the key pattern match a known provider format (AWS, Stripe, etc.)?
    {code_context}
  expected_output: finding_assessment
  min_confidence: 0.7

remediation_template: |
  Store API keys in environment variables or a secrets manager.
  Rotate any keys that were committed to source control immediately.
effort_hours: 1

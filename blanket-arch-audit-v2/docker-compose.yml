# Local development — all services
version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - BLANKETAUDIT_LLM__PROVIDER=none
      - BLANKETAUDIT_NEO4J_URI=bolt://neo4j:7687
      - BLANKETAUDIT_NEO4J_USER=neo4j
      - BLANKETAUDIT_NEO4J_PASSWORD=blanketaudit
      - BLANKETAUDIT_MILVUS_URI=http://milvus:19530
      - BLANKETAUDIT_SQLITE_PATH=/data/blanketaudit.db
      - BLANKETAUDIT_LOG_LEVEL=DEBUG
      - BLANKETAUDIT_LOG_JSON=false
    volumes:
      - scan-data:/data
      - ./blanketaudit:/app/blanketaudit:ro
    depends_on:
      - neo4j
      - milvus

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/blanketaudit
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data

  milvus:
    image: milvusdb/milvus:v2.4-latest
    ports:
      - "19530:19530"
    environment:
      - ETCD_USE_EMBED=true
      - COMMON_STORAGETYPE=local
    volumes:
      - milvus-data:/var/lib/milvus

  web:
    build:
      context: ./web
      dockerfile: ../Dockerfile.web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  scan-data:
  neo4j-data:
  milvus-data:

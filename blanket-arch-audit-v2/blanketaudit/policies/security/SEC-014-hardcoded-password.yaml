id: SEC-014
name: Hardcoded Password in Source Code
category: security
severity: high
description: Detects password literals assigned directly in source code.
frameworks: [hipaa, soc2, pci-dss]

static_checks:
  - tool: regex
    regex: "(?:password|passwd|pwd)\\s*=\\s*[\"'][^\"'\\n]{4,}[\"']"
  - tool: gitleaks
    rule: password-in-source

ai_analysis:
  prompt_template: |
    Analyze this potential hardcoded password. Consider:
    - Is this a default/placeholder in test code or documentation?
    - Is the variable actually used for authentication?
    - Could this be a configuration key name rather than a value?
    {code_context}
  expected_output: finding_assessment
  min_confidence: 0.7

remediation_template: |
  Move passwords to environment variables or a secrets manager (Vault, AWS SSM).
  Use os.environ["DB_PASSWORD"] or a config provider instead of hardcoded values.
effort_hours: 1

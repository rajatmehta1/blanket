[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.api"

[deploy]
startCommand = "uvicorn blanketaudit.api.app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"

[environments.production.variables]
BLANKETAUDIT_LOG_JSON = "true"
BLANKETAUDIT_LOG_LEVEL = "INFO"

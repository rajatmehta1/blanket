[project]
name="blanketaudit"
version = "0.1.0"
description = "AI-powered architecture governance platform"
requires-python = ">=3.11"
dependencies = [
  # LLM Framework
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.3",
  "langchain-groq>=0.1",
  "langchain-google-genai>=2.0",
  "langgraph>=0.2",
  # Static Analysis Tools (called as subprocesses)
  # Semgrep, Gitleaks, OSV-scanner installed separately
  # Parsing
  "tree-sitter>=0.23",
  "tree-sitter-java",
  "tree-sitter-python",
  "tree-sitter-typescript",
  # Storage
  "neo4j>=5.0",
  "pymilvus>=2.4",
  "aiosqlite",
  "sqlalchemy[asyncio]>=2.0",
  # API + CLI
  "fastapi>=0.110",
  "uvicorn[standard]",
  "pydantic>=2.0",
  "pydantic-settings",
  "typer[all]",
  "rich",
  # Report
  "weasyprint",
  "jinja2",
  "pygments",
  # Observability
  "structlog",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation-fastapi",
  "prometheus-client",
  "sentry-sdk[fastapi]",
  # Utils
  "httpx",
  "tenacity",
  "pyyaml",
  "pathspec",
  "tiktoken",
  "thefuzz",
  "sentence-transformers>=2.0",
]

[project.scripts]
blanketaudit = "blanketaudit.cli.main:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blanketaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
